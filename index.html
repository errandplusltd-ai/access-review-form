<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Document Request</title>

  <style>
    /* KEEP YOUR EXISTING CSS HERE */
  </style>
</head>

<body>

  <div class="form-card">

    <div class="form-header">
      <h1>Document Request</h1>
      <p>Submit your request below.</p>
    </div>

    <div class="required-hint">
      <span>*</span> Required fields
    </div>

    <form id="accessForm" novalidate>

      <div class="form-group">
        <label for="fullName">
          Full name <span class="required-star">*</span>
        </label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          placeholder="e.g. Jane Doe"
          required
        >
      </div>

      <div class="form-row">

        <div class="form-group">
          <label for="schoolEmail">
            School email <span class="required-star">*</span>
          </label>
          <input
            type="email"
            id="schoolEmail"
            name="schoolEmail"
            placeholder="jane@school.edu"
            required
          >
        </div>

        <div class="form-group">
          <label for="personalEmail">
            Personal email
            <span class="optional-tag">optional</span>
          </label>
          <input
            type="email"
            id="personalEmail"
            name="personalEmail"
            placeholder="jane@example.com"
          >
        </div>

      </div>

      <div class="form-row">

        <div class="form-group">
          <label for="phone">
            Phone number
            <span class="optional-tag">optional</span>
          </label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="+1 (555) 000-0000"
          >
        </div>

        <div class="form-group">
          <label for="document">
            Document requested
            <span class="required-star">*</span>
          </label>
          <input
            type="text"
            id="document"
            name="document"
            placeholder="e.g. Transcript, Report"
            required
          >
        </div>

      </div>

      <div class="form-group">
        <label for="reason">
          Reason for access
          <span class="required-star">*</span>
        </label>

        <textarea
          id="reason"
          name="reason"
          rows="4"
          placeholder="Briefly explain your request."
          required
        ></textarea>
      </div>

      <button type="submit" class="btn-submit">
        Submit Request
      </button>

      <p id="message" class="message" role="status"></p>

    </form>

    <div class="form-footer">
      Your information is kept confidential.
    </div>

  </div>

  <!-- Load Supabase BEFORE your JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Load your JavaScript LAST -->
  <script src="script.js"></script>

</body>
</html>
