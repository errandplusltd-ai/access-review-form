<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Access Request</title>
  <style>
    /* ── Reset & Base ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      margin: 0;
    }

    /* ── Card Container ── */
    .form-card {
      max-width: 640px;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 2.5rem 2.75rem;
      box-shadow:
        0 20px 50px rgba(0, 20, 40, 0.12),
        0 8px 24px rgba(0, 20, 40, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: transform 0.2s ease;
    }

    .form-card:hover {
      transform: translateY(-2px);
    }

    /* ── Header ── */
    .form-header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .form-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #0b2a3e;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }

    .form-header h1 span {
      background: linear-gradient(135deg, #1a6b8a, #3a9ec4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .form-header p {
      font-size: 0.95rem;
      color: #4a667a;
      margin-top: 0.25rem;
      font-weight: 400;
    }

    .form-header .badge {
      display: inline-block;
      background: linear-gradient(135deg, #d4edf8, #b8ddee);
      color: #0f4b66;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 1rem;
      border-radius: 50px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    /* ── Form Fields ── */
    .form-group {
      margin-bottom: 1.35rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #1d3b4f;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }

    label .required-star {
      color: #d45a6b;
      font-weight: 700;
      margin-left: 2px;
    }

    label .optional-tag {
      font-weight: 400;
      font-size: 0.65rem;
      text-transform: none;
      color: #7a95aa;
      background: #eef4f8;
      padding: 0.1rem 0.6rem;
      border-radius: 30px;
      margin-left: 0.5rem;
    }

    input,
    textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      background: #ffffff;
      border: 1.5px solid #dde7ef;
      border-radius: 14px;
      transition: all 0.2s ease;
      color: #0b2a3e;
      box-shadow: 0 2px 6px rgba(0, 20, 30, 0.02);
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #3a9ec4;
      box-shadow: 0 0 0 4px rgba(58, 158, 196, 0.12), 0 2px 8px rgba(0, 20, 30, 0.04);
      background: #ffffff;
    }

    input::placeholder,
    textarea::placeholder {
      color: #a5bccf;
      font-weight: 400;
      font-size: 0.9rem;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
      border-radius: 14px;
    }

    /* ── Inline Row (2 columns) ── */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 500px) {
      .form-row {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }

    /* ── Required hint ── */
    .required-hint {
      font-size: 0.75rem;
      color: #7a95aa;
      text-align: right;
      margin-bottom: 1.25rem;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .required-hint span {
      color: #d45a6b;
      font-weight: 600;
    }

    /* ── Submit Button ── */
    .btn-submit {
      width: 100%;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      color: #ffffff;
      background: linear-gradient(145deg, #1a6b8a, #2d8db0);
      border: none;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 18px rgba(26, 107, 138, 0.25);
      letter-spacing: 0.4px;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-submit:hover {
      background: linear-gradient(145deg, #0f5a78, #1f7a9e);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(26, 107, 138, 0.30);
    }

    .btn-submit:active {
      transform: translateY(0px);
      box-shadow: 0 4px 12px rgba(26, 107, 138, 0.20);
    }

    .btn-submit svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* ── Message ── */
    .message {
      margin-top: 1.25rem;
      padding: 0.85rem 1.25rem;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 500;
      display: none;
      text-align: center;
      background: #e9f4fa;
      color: #0f4b66;
      border-left: 4px solid #3a9ec4;
    }

    .message.success {
      display: block;
      background: #e1f3e9;
      color: #0f5a3e;
      border-left-color: #2b9c6b;
    }

    .message.error {
      display: block;
      background: #fce8ea;
      color: #9e3b4a;
      border-left-color: #d45a6b;
    }

    /* ── Footer Note ── */
    .form-footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #8aa3b7;
      text-align: center;
      border-top: 1px solid rgba(0, 20, 30, 0.06);
      padding-top: 1.25rem;
    }

    .form-footer a {
      color: #2d8db0;
      text-decoration: none;
      font-weight: 500;
    }

    .form-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <!-- Header -->
    <div class="form-header">
      <h1>📄 <span>Document Access</span> Request</h1>
      <p>Please fill in the details below to request viewing access.</p>
      <span class="badge">🔒 Secure · Admin Protected</span>
    </div>

    <!-- Required hint -->
    <div class="required-hint">
      <span>*</span> Required fields
    </div>

    <!-- Form -->
    <form id="accessForm" novalidate>
      <!-- Full Name -->
      <div class="form-group">
        <label for="fullName">
          Full name <span class="required-star">*</span>
        </label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          placeholder="e.g. Jane Doe"
          required
        />
      </div>

      <!-- Row: School Email + Personal Email -->
      <div class="form-row">
        <div class="form-group">
          <label for="schoolEmail">
            School email <span class="required-star">*</span>
          </label>
          <input
            type="email"
            id="schoolEmail"
            name="schoolEmail"
            placeholder="jane@school.edu"
            required
          />
        </div>

        <div class="form-group">
          <label for="personalEmail">
            Personal email <span class="optional-tag">optional</span>
          </label>
          <input
            type="email"
            id="personalEmail"
            name="personalEmail"
            placeholder="jane@example.com"
          />
        </div>
      </div>

      <!-- Row: Phone + Document -->
      <div class="form-row">
        <div class="form-group">
          <label for="phone">
            Phone number <span class="optional-tag">optional</span>
          </label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="+1 (555) 000-0000"
          />
        </div>

        <div class="form-group">
          <label for="document">
            Document requested <span class="required-star">*</span>
          </label>
          <input
            type="text"
            id="document"
            name="document"
            placeholder="e.g. Transcript, Report"
            required
          />
        </div>
      </div>

      <!-- Reason -->
      <div class="form-group">
        <label for="reason">
          Reason for access <span class="required-star">*</span>
        </label>
        <textarea
          id="reason"
          name="reason"
          rows="4"
          placeholder="Briefly explain why you need access to this document."
          required
        ></textarea>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-submit">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
        Submit Request
      </button>

      <!-- Status message -->
      <p id="message" class="message" role="status"></p>
    </form>

    <!-- Footer -->
    <div class="form-footer">
      <span>🔐 Your information is kept confidential.</span>
      <br />
      <a href="#">Privacy Policy</a> &middot; 
      <a href="#">Contact Support</a>
    </div>
  </div>

  <!-- ── Optional JS for demo ── -->
  <script>
    document.getElementById('accessForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const msg = document.getElementById('message');
      const name = document.getElementById('fullName').value.trim();
      const email = document.getElementById('schoolEmail').value.trim();
      const doc = document.getElementById('document').value.trim();
      const reason = document.getElementById('reason').value.trim();

      if (!name || !email || !doc || !reason) {
        msg.className = 'message error';
        msg.textContent = '⚠️ Please fill in all required fields before submitting.';
        return;
      }

      // Simulate success
      msg.className = 'message success';
      msg.textContent = '✅ Your request has been submitted. You will receive access confirmation shortly.';
   </main>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
