```html
<form id="accessForm">
  <label>
    Full name*
    <input
      type="text"
      id="fullName"
      name="fullName"
      placeholder="Jane Doe"
      required
    >
  </label>

  <label>
    School email*
    <input
      type="email"
      id="schoolEmail"
      name="schoolEmail"
      placeholder="jane@school.edu"
      required
    >
  </label>

  <label>
    Personal email
    <input
      type="email"
      id="personalEmail"
      name="personalEmail"
      placeholder="jane@example.com"
    >
  </label>

  <label>
    Phone number
    <input
      type="tel"
      id="phone"
      name="phone"
      placeholder="+1 (555) 000-0000"
    >
  </label>

  <label>
    Document requested*
    <input
      type="text"
      id="document"
      name="document"
      placeholder="Document name"
      required
    >
  </label>

  <label>
    Reason for access*
    <textarea
      id="reason"
      name="reason"
      rows="4"
      placeholder="Briefly explain your request."
      required
    ></textarea>
  </label>

  <button type="submit">Submit request</button>

  <p id="message" class="message" role="status"></p>
</form>
```
